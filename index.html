
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAWZPAY - Digital Wallet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080f20;color:white;
 font-family:Arial,sans-serif;padding:20px;
}
.container{max-width:430px;margin:25px auto}
.logo{text-align:center;font-size:30px;font-weight:bold;color:#60a5fa;margin-bottom:25px}
.card{background:#14213a;padding:23px;border-radius:20px;margin-bottom:18px}
h2{text-align:center}
input{
 width:100%;padding:15px;margin:9px 0;
 background:#0b1528;border:1px solid #334766;
 border-radius:10px;color:white;font-size:15px;
}
button{
 width:100%;padding:15px;border:0;border-radius:10px;
 background:#2563eb;color:white;font-weight:bold;
 font-size:15px;margin-top:10px;
}
.secondary{background:#26364d}
.hidden{display:none}
small{color:#a9bad3}
.balance{font-size:30px;font-weight:bold;margin:15px 0}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{background:#26364d;padding:20px;border-radius:13px;text-align:center}
#message{text-align:center;color:#60a5fa;margin-top:15px;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="container">

<div class="logo">◈ NAWZPAY</div>

<div id="auth">
 <div class="card">
  <h2 id="formTitle">Login NAWZPAY</h2>

  <div id="nameBox" class="hidden">
   <input id="name" placeholder="Nama lengkap">
  </div>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button id="submitBtn" onclick="submitAuth()">LOGIN</button>

  <button class="secondary" onclick="toggleMode()" id="switchBtn">
   Belum punya akun? Daftar
  </button>

  <p id="message"></p>
 </div>
</div>

<div id="dashboard" class="hidden">

 <div class="card">
  <small>SELAMAT DATANG</small>
  <h2 id="userName">Pengguna</h2>
  <small>SALDO DEMO</small>
  <div class="balance">Rp 0</div>
  <small>Saldo belum diaktifkan</small>
 </div>

 <div class="card">
  <h3>Menu Utama</h3>
  <div class="menu">
   <div class="item">➕<p>Top Up</p></div>
   <div class="item">➤<p>Transfer</p></div>
   <div class="item">▦<p>QRIS</p></div>
   <div class="item">◷<p>Riwayat</p></div>
  </div>
  <button class="secondary" onclick="logout()">LOGOUT</button>
 </div>

 <p style="text-align:center;color:#8295b4;font-size:12px">
 NAWZPAY © 2026
 </p>
</div>
</div>

<script>
const SUPABASE_URL = "https://tgfirpvkzgwzwzyxhfbr.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_ENHcI_Bc15oI97n6e5X3WA_yJya7rGK";

const client = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let registerMode = false;

function toggleMode(){
 registerMode = !registerMode;

 document.getElementById("formTitle").textContent =
 registerMode ? "Daftar NAWZPAY" : "Login NAWZPAY";

 document.getElementById("submitBtn").textContent =
 registerMode ? "DAFTAR SEKARANG" : "LOGIN";

 document.getElementById("switchBtn").textContent =
 registerMode ? "Sudah punya akun? Login" : "Belum punya akun? Daftar";

 document.getElementById("nameBox").classList.toggle("hidden",!registerMode);
 document.getElementById("message").textContent = "";
}

async function submitAuth(){
 const email = document.getElementById("email").value.trim();
 const password = document.getElementById("password").value;
 const name = document.getElementById("name").value.trim();
 const msg = document.getElementById("message");
 const btn = document.getElementById("submitBtn");

 if(!email || !password){
  msg.textContent = "Isi email dan password!";
  return;
 }

 if(password.length < 8){
  msg.textContent = "Password minimal 8 karakter!";
  return;
 }

 if(registerMode && !name){
  msg.textContent = "Isi nama lengkap!";
  return;
 }

 btn.disabled = true;
 msg.textContent = "Memproses...";

 try{
  let result;

  if(registerMode){
   result = await client.auth.signUp({
    email,
    password,
    options:{data:{display_name:name}}
   });
  }else{
   result = await client.auth.signInWithPassword({
    email,password
   });
  }

  if(result.error) throw result.error;

  if(registerMode && !result.data.session){
   msg.textContent = "Pendaftaran berhasil. Periksa email untuk verifikasi.";
   return;
  }

  await showDashboard(result.data.user);

 }catch(error){
  msg.textContent = error.message;
 }finally{
  btn.disabled = false;
 }
}

async function showDashboard(user){
 if(!user)return;

 document.getElementById("auth").classList.add("hidden");
 document.getElementById("dashboard").classList.remove("hidden");

 document.getElementById("userName").textContent =
 user.user_metadata?.display_name || user.email;
}

async function logout(){
 await client.auth.signOut();
 document.getElementById("dashboard").classList.add("hidden");
 document.getElementById("auth").classList.remove("hidden");
}

async function init(){
 const {data,error} = await client.auth.getSession();

 if(error){
  document.getElementById("message").textContent = error.message;
  return;
 }

 if(data.session){
  await showDashboard(data.session.user);
 }
}

init();
</script>
</body>
</html>
